name: Bootstrap Ubique V1

on:
  push:
    branches: [build/v1-application-crm]
    paths:
      - '.bootstrap/part-*'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/v1-application-crm
      - name: Expand project archive
        run: |
          cat .bootstrap/part-* | base64 -d > /tmp/ubique-v1.tgz
          tar -xzf /tmp/ubique-v1.tgz -C .
          rm -rf .bootstrap
      - name: Commit generated application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: build Ubique application CRM V1"
            git push origin build/v1-application-crm
          fi
