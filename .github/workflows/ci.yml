name: CI

on:
  push:
    branches: [main, build/v1-application-crm]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Secret scan
        run: node scripts/secret-scan.mjs
      - name: Install
        run: npm install
      - name: Dependency audit (critical)
        run: npm audit --audit-level=critical
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
